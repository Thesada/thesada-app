# PR gate + post-merge run on dev and main: lint, pools-App guard, unit tests,
# and Go security scanners. Go comes from go.mod via actions/setup-go.
name: ci

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      # --build-tags integration so //go:build integration files lint too.
      - name: Run lint
        run: $(go env GOPATH)/bin/golangci-lint run --build-tags integration ./...

  # Forbid new pools.App.{Query,Exec,...} callers outside the pkg/db contract.
  pools-app-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Guard pools.App direct callers
        run: bash scripts/check-pools-app.sh

  # Unit tests (no DB). Integration lane needs a Docker-capable runner with
  # testcontainers; add when one is wired up.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test

  # 80%+ floor on csrf, oauth, pki, authmw + the file pkg/service/auth.go.
  # Runs -tags integration; testcontainers uses ubuntu-latest's Docker daemon.
  coverage:
    runs-on: ubuntu-latest
    # testcontainers spins Docker; bound the job so a daemon/pull/cleanup
    # stall can't hold the runner to GitHub's 360-min default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Security-package coverage gate (>= 80%)
        run: bash scripts/check-coverage.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
      # Full report to logs (non-gating), then gate on HIGH severity.
      - name: Full report
        run: $(go env GOPATH)/bin/gosec -fmt text ./... || true
      - name: Gate on HIGH severity
        run: $(go env GOPATH)/bin/gosec -severity high -confidence medium -fmt text -quiet ./...

  # Every non-merge commit in a PR must carry Signed-off-by. PR-only: the
  # squash commit on dev/main is written by the merge box, not a contributor.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" \
                | grep -qiE '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              echo "missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "" >&2
            echo "Fix the whole branch with: git rebase --signoff $BASE_REF" >&2
            exit 1
          fi
